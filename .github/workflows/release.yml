name: release

# Build Byrgenwerth for Windows and macOS and publish a release, either by pushing a
# tag like v0.8.0 or from the Actions tab ("Run workflow", enter the version).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.8.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./...
      - run: go build -ldflags "-H windowsgui -s -w -X main.version=$($env:VERSION.TrimStart('v'))" -o Byrgenwerth.exe .
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          notes="docs/release-notes/${VERSION}.md"
          if [ -f "$notes" ]; then
            gh release create "$VERSION" Byrgenwerth.exe --target "$GITHUB_SHA" --title "Byrgenwerth $VERSION" --notes-file "$notes"
          else
            gh release create "$VERSION" Byrgenwerth.exe --target "$GITHUB_SHA" --title "Byrgenwerth $VERSION" --generate-notes
          fi

  macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./...
      - name: Build and attach
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          scripts/build-mac.sh "${VERSION#v}"
          gh release upload "$VERSION" dist/Byrgenwerth-macos.zip
