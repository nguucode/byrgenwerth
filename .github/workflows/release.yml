name: release

# Push a tag like v0.8.0 to build DeathCounter.exe on Windows and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./...
      - run: go build -ldflags "-H windowsgui -s -w" -o DeathCounter.exe .
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" DeathCounter.exe --title "Death Counter $GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" DeathCounter.exe --title "Death Counter $GITHUB_REF_NAME" --generate-notes
          fi
