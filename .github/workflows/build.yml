name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./...

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./...  # includes Vision OCR on a real image
      - run: sh -n install.sh
      - run: scripts/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Byrgenwerth-macos
          path: dist/Byrgenwerth-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet -unsafeptr=false ./...  # COM/WinRT pointers are foreign memory
      - run: go test ./...  # includes the DPAPI round trip, which needs Windows
      - name: Parse install.ps1
        shell: powershell  # Windows PowerShell 5.1, what most users have
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs; exit 1 }
      - run: go build -ldflags "-H windowsgui -s -w" -o Byrgenwerth.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: Byrgenwerth
          path: Byrgenwerth.exe
