name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet -unsafeptr=false ./...  # COM/WinRT pointers are foreign memory
      - run: go build -ldflags "-H windowsgui -s -w" -o DeathCounter.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: DeathCounter
          path: DeathCounter.exe
